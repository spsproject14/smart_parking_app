{% extends 'auth_base.html' %} {% block auth_content %}
<h2>Welcome back</h2>
<p class="subtitle">Sign in to manage your parking.</p>
<form method="post" action="{{url_for('login')}}">
  <div class="field">
    <label>Email address</label
    ><input
      type="email"
      name="email"
      placeholder="you@example.com"
      required
      autocomplete="email"
    />
  </div>
  <div class="field">
    <label>Password</label
    ><input
      type="password"
      name="password"
      placeholder="Enter your password"
      required
      autocomplete="current-password"
    />
  </div>
  <div style="text-align: right; margin: -3px 0 18px">
    <a class="text-link" href="{{url_for('forgot_password')}}"
      >Forgot password?</a
    >
  </div>
  <button class="btn btn-primary" type="submit">
    Sign in <i class="fa-solid fa-arrow-right"></i>
  </button>
</form>
<div class="auth-bottom">
  New to ParkEase? <a href="{{url_for('signup')}}">Create an account</a>
</div>
{% endblock %}

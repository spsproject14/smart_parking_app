{% extends 'auth_base.html' %} {% block auth_content %}
<h2>Choose a new password</h2>
<p class="subtitle">Use at least 8 characters.</p>
<form method="post">
  <div class="field">
    <label>New password</label
    ><input
      type="password"
      name="password"
      required
      minlength="8"
      autocomplete="new-password"
    />
  </div>
  <button class="btn btn-primary">
    Update password <i class="fa-solid fa-lock"></i>
  </button>
</form>
{% endblock %}

{% extends 'auth_base.html' %} {% block auth_content %}
<h2>Reset your password</h2>
<p class="subtitle">We'll email a secure reset link if the account exists.</p>
<form method="post">
  <div class="field">
    <label>Email address</label
    ><input type="email" name="email" required placeholder="you@example.com" />
  </div>
  <button class="btn btn-primary">
    Send reset link <i class="fa-regular fa-envelope"></i>
  </button>
</form>
<div class="auth-bottom">
  <a href="{{url_for('login')}}">Back to sign in</a>
</div>
{% endblock %}
